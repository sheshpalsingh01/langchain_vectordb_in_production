[project]
name = "langchain-vectordb-in-production"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sheshpal Singh", email = "sheshpalsingh2024@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "deeplake>=4.7.4",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pymupdf>=1.28.2",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "tiktoken>=0.14.0",
    "unstructured>=0.27.6",
]

[project.scripts]
langchain-vectordb-in-production = "langchain_vectordb_in_production:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
